# =====================================================================
# apify.yaml — whole-market searches via Apify (Indeed).
#
# Requires APIFY_TOKEN in your env. The Indeed actor (misceres/indeed-scraper)
# is free / pay-per-use, so these run on the free tier. LinkedIn scrapers on
# Apify are PAID "rental" actors (403 on free accounts) — left out on purpose.
#
# Each search hits one of your target role families across the whole US. The
# scoring layer (role gate + US filter + experience guardrail) then ranks and
# trims, so casting a broad net here is fine.
#
# Cost note: maxItems caps results per search. Keep it modest. Run with
#   python -m jobhunt.cli apify              (all searches)
#   python -m jobhunt.cli apify --only indeed-solutions --limit 5   (test one)
# =====================================================================

searches:
  # --- AI solutions / enablement / implementation (your #1 track) -----------
  - actor: misceres~indeed-scraper
    label: indeed-solutions
    input:
      position: "solutions consultant"
      location: "United States"
      country: "US"
      maxItems: 50
      parseCompanyDetails: false

  - actor: misceres~indeed-scraper
    label: indeed-implementation
    input:
      position: "implementation consultant"
      location: "United States"
      country: "US"
      maxItems: 50
      parseCompanyDetails: false

  # --- portfolio analytics / risk / performance ----------------------------
  - actor: misceres~indeed-scraper
    label: indeed-analytics
    input:
      position: "portfolio analyst risk analytics"
      location: "United States"
      country: "US"
      maxItems: 50
      parseCompanyDetails: false

  # --- strategy & ops / business ops ---------------------------------------
  - actor: misceres~indeed-scraper
    label: indeed-strategy-ops
    input:
      position: "strategy and operations"
      location: "United States"
      country: "US"
      maxItems: 50
      parseCompanyDetails: false

  # --- investor relations / capital markets / fund ops ---------------------
  - actor: misceres~indeed-scraper
    label: indeed-ir-markets
    input:
      position: "investor relations capital markets"
      location: "United States"
      country: "US"
      maxItems: 50
      parseCompanyDetails: false

# To add LinkedIn later, subscribe to a rental actor in the Apify Store and add
# it here with its own input schema (check the actor's page for field names).
